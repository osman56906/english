<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Grammar & Vocabulary Quiz</title>
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --card-bg: #121212;
      --card-border: #222222;
      --purple-glow: rgba(168, 85, 247, 0.4);
      --purple-hover: #a855f7;
    }

    /* First question mode: White background */
    body.q1-mode {
      --bg-color: #ffffff;
      --text-color: #000000;
      --card-bg: #f5f5f5;
      --card-border: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .quiz-container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .question-number-badge {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .question-category {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.7;
      margin-bottom: 18px;
    }

    .question-text {
      font-size: 1.35rem;
      text-align: center;
      font-weight: 600;
      margin-bottom: 30px;
      line-height: 1.4;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 2x2 Grid Layout for Answers */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      margin-bottom: 25px;
    }

    /* Rounded rectangular cards with glowing purple shadow */
    .answer-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 15px var(--purple-glow);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 75px;
      outline: none;
    }

    .answer-btn:hover:not(:disabled) {
      border-color: var(--purple-hover);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
      transform: translateY(-2px);
    }

    .answer-btn:disabled {
      cursor: not-allowed;
    }

    .answer-btn.correct {
      background-color: #15803d !important;
      color: #ffffff !important;
      border-color: #22c55e !important;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.6) !important;
    }

    .answer-btn.incorrect {
      background-color: #b91c1c !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6) !important;
    }

    .feedback-message {
      height: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 15px;
    }

    .feedback-message.correct-text {
      color: #22c55e;
    }

    .feedback-message.incorrect-text {
      color: #ef4444;
    }

    .next-btn {
      background: var(--purple-hover);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 15px var(--purple-glow);
      transition: all 0.2s ease;
      visibility: hidden;
    }

    .next-btn.visible {
      visibility: visible;
    }

    .next-btn:hover {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.9);
      transform: scale(1.03);
    }

    /* Results Screen */
    .results-container {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .results-score {
      font-size: 4rem;
      font-weight: 900;
      margin: 20px 0;
      color: #a855f7;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    .restart-btn {
      background: #a855f7;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      margin-top: 20px;
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.8);
    }

    @media (max-width: 500px) {
      .answers-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="q1-mode">

  <div class="quiz-container" id="quizContainer">
    <div class="header-info">
      <span>English Quiz</span>
      <span id="scoreTracker">Score: 0 / 35</span>
    </div>

    <div class="question-number-badge" id="questionBadge">Question 1</div>
    <div class="question-category" id="questionCategory">Articles (a, an, the)</div>
    
    <div class="question-text" id="questionText">Loading question...</div>

    <div class="answers-grid" id="answersGrid">
      <!-- 4 answer buttons rendered dynamically -->
    </div>

    <div class="feedback-message" id="feedbackMessage"></div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
  </div>

  <div class="results-container" id="resultsContainer">
    <h1>Quiz Completed!</h1>
    <div class="results-score" id="finalScore">0 / 35</div>
    <p id="resultComment" style="font-size: 1.2rem; opacity: 0.9;"></p>
    <button class="restart-btn" onclick="restartQuiz()">Try Again</button>
  </div>

  <script>
    const questions = [
      // Articles (a, an, the)
      { cat: "Articles", q: "I have ___ apple.", options: ["a", "an", "the", "—"], answer: 1 },
      { cat: "Articles", q: "She is reading ___ book.", options: ["an", "a", "the", "—"], answer: 1 },
      { cat: "Articles", q: "___ sun is very bright today.", options: ["A", "An", "The", "—"], answer: 2 },
      { cat: "Articles", q: "He works as ___ engineer.", options: ["a", "an", "the", "—"], answer: 1 },
      { cat: "Articles", q: "Can you pass me ___ salt, please?", options: ["a", "an", "the", "—"], answer: 2 },
      { cat: "Articles", q: "This is ___ honest person.", options: ["a", "an", "the", "—"], answer: 1 },
      { cat: "Articles", q: "Look at ___ moon in the night sky!", options: ["a", "an", "the", "—"], answer: 2 },

      // Main Colors
      { cat: "Colors", q: "What color is the clear sky on a sunny day?", options: ["Red", "Blue", "Green", "Yellow"], answer: 1 },
      { cat: "Colors", q: "What color is grass?", options: ["Blue", "Yellow", "Green", "White"], answer: 2 },
      { cat: "Colors", q: "What color is a ripe banana?", options: ["Red", "Yellow", "Purple", "Green"], answer: 1 },
      { cat: "Colors", q: "What color are ripe strawberries?", options: ["Red", "Black", "Blue", "Orange"], answer: 0 },
      { cat: "Colors", q: "What color do you get when you mix red and yellow?", options: ["Green", "Purple", "Orange", "Black"], answer: 2 },
      { cat: "Colors", q: "What color is fresh snow?", options: ["Black", "White", "Gray", "Blue"], answer: 1 },
      { cat: "Colors", q: "What color is charcoal or night time?", options: ["White", "Yellow", "Black", "Green"], answer: 2 },

      // Months
      { cat: "Months", q: "What is the first month of the year?", options: ["February", "March", "January", "December"], answer: 2 },
      { cat: "Months", q: "Which month comes immediately after March?", options: ["April", "May", "June", "February"], answer: 0 },
      { cat: "Months", q: "What is the last month of the year?", options: ["November", "October", "December", "August"], answer: 2 },
      { cat: "Months", q: "Which month usually has 28 days?", options: ["January", "February", "July", "September"], answer: 1 },
      { cat: "Months", q: "Which month comes right before October?", options: ["August", "September", "November", "July"], answer: 1 },
      { cat: "Months", q: "Which of these is a summer month?", options: ["December", "January", "July", "October"], answer: 2 },
      { cat: "Months", q: "How many months are there in one year?", options: ["10", "11", "12", "14"], answer: 2 },

      // Numbers up to 20
      { cat: "Numbers", q: "What number comes right after 14?", options: ["13", "15", "16", "12"], answer: 1 },
      { cat: "Numbers", q: "How do you spell the number 12 in English?", options: ["Twelve", "Twelvee", "Twelv", "Twelft"], answer: 0 },
      { cat: "Numbers", q: "What is 8 + 5?", options: ["11", "12", "13", "14"], answer: 2 },
      { cat: "Numbers", q: "What is 20 - 4?", options: ["14", "15", "16", "17"], answer: 2 },
      { cat: "Numbers", q: "How do you write '19' in words?", options: ["Nineteen", "Ninty", "Nineteene", "Nineten"], answer: 0 },
      { cat: "Numbers", q: "What number is 'eleven'?", options: ["7", "11", "13", "15"], answer: 1 },
      { cat: "Numbers", q: "What number comes immediately before 20?", options: ["18", "19", "17", "16"], answer: 1 },

      // Days of the Week
      { cat: "Days of the Week", q: "What is the first day of the school week?", options: ["Sunday", "Monday", "Tuesday", "Friday"], answer: 1 },
      { cat: "Days of the Week", q: "Which day comes after Friday?", options: ["Thursday", "Sunday", "Saturday", "Monday"], answer: 2 },
      { cat: "Days of the Week", q: "Which day comes right before Wednesday?", options: ["Monday", "Tuesday", "Thursday", "Friday"], answer: 1 },
      { cat: "Days of the Week", q: "How many days are in a week?", options: ["5", "6", "7", "8"], answer: 2 },
      { cat: "Days of the Week", q: "Which days make up the weekend?", options: ["Monday & Tuesday", "Thursday & Friday", "Saturday & Sunday", "Wednesday & Thursday"], answer: 2 },
      { cat: "Days of the Week", q: "What day comes after Sunday?", options: ["Monday", "Saturday", "Tuesday", "Friday"], answer: 0 },
      { cat: "Days of the Week", q: "What day is between Wednesday and Friday?", options: ["Tuesday", "Thursday", "Saturday", "Sunday"], answer: 1 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const body = document.body;
    const questionBadge = document.getElementById('questionBadge');
    const questionCategory = document.getElementById('questionCategory');
    const questionText = document.getElementById('questionText');
    const answersGrid = document.getElementById('answersGrid');
    const scoreTracker = document.getElementById('scoreTracker');
    const feedbackMessage = document.getElementById('feedbackMessage');
    const nextBtn = document.getElementById('nextBtn');
    const quizContainer = document.getElementById('quizContainer');
    const resultsContainer = document.getElementById('resultsContainer');
    const finalScore = document.getElementById('finalScore');
    const resultComment = document.getElementById('resultComment');

    function loadQuestion() {
      answered = false;
      feedbackMessage.innerText = "";
      feedbackMessage.className = "feedback-message";
      nextBtn.classList.remove('visible');

      // Question 1 = White background, Questions 2-35 = Black background
      if (currentQuestionIndex === 0) {
        body.classList.add('q1-mode');
      } else {
        body.classList.remove('q1-mode');
      }

      const qData = questions[currentQuestionIndex];
      questionBadge.innerText = `Question ${currentQuestionIndex + 1}`;
      questionCategory.innerText = qData.cat;
      questionText.innerText = qData.q;

      answersGrid.innerHTML = "";
      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        answersGrid.appendChild(btn);
      });
    }

    function selectAnswer(selectedIndex) {
      if (answered) return;
      answered = true;

      const qData = questions[currentQuestionIndex];
      const buttons = answersGrid.children;

      if (selectedIndex === qData.answer) {
        score++;
        buttons[selectedIndex].classList.add('correct');
        feedbackMessage.innerText = "Правильно! (Correct!)";
        feedbackMessage.classList.add('correct-text');
      } else {
        buttons[selectedIndex].classList.add('incorrect');
        buttons[qData.answer].classList.add('correct');
        feedbackMessage.innerText = "Неправильно! (Incorrect!)";
        feedbackMessage.classList.add('incorrect-text');
      }

      scoreTracker.innerText = `Score: ${score} / 35`;

      for (let btn of buttons) {
        btn.disabled = true;
      }

      nextBtn.classList.add('visible');
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizContainer.style.display = 'none';
      resultsContainer.style.display = 'flex';
      body.classList.remove('q1-mode');
      finalScore.innerText = `${score} / 35 баллов`;

      if (score === 35) {
        resultComment.innerText = "Отличная работа! Полный балл! (Perfect Score!)";
      } else if (score >= 25) {
        resultComment.innerText = "Хороший результат! (Great job!)";
      } else {
        resultComment.innerText = "Попробуйте еще раз для лучшего результата! (Keep practicing!)";
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      scoreTracker.innerText = `Score: 0 / 35`;
      resultsContainer.style.display = 'none';
      quizContainer.style.display = 'flex';
      loadQuestion();
    }

    // Start quiz on load
    loadQuestion();
  </script>
</body>
</html>
